<!DOCTYPE html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sosial Media Plattform</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <!-- Navbar -->
    <nav id="navbar" class="navbar" style="display: none;">
      <h1>Sosial Media Plattform</h1>
      <button id="logout-btn" class="logout-button" data-testid="logout-btn">Logg ut</button>
    </nav>

    <main>
      <!-- Auth Container -->
      <div class="container">
        <!-- Login -->
        <section id="login-section" class="form-container">
          <h2>Logg inn</h2>
          <form id="login-form" data-testid="login-form">
            <input type="email" id="login-email" placeholder="E-post" required data-testid="login-email" />
            <input type="password" id="login-password" placeholder="Passord" required data-testid="login-password" />
            <button type="submit" data-testid="login-btn">Logg inn</button>
            <button type="button" id="switch-to-register" class="secondary-btn" data-testid="switch-to-register">
              Har du ikke en konto? Registrer deg
            </button>
          </form>
        </section>

        <!-- Register -->
        <section id="register-section" class="form-container" style="display: none;">
          <h2>Registrer deg</h2>
          <form id="register-form" data-testid="register-form">
            <input type="text" id="register-name" placeholder="Brukernavn" required data-testid="register-name" />
            <input type="email" id="register-email" placeholder="E-post (@noroff.no)" required data-testid="register-email" />
            <input type="password" id="register-password" placeholder="Passord" required data-testid="register-password" />
            <button type="submit" data-testid="register-btn">Registrer</button>
            <button type="button" id="switch-to-login" class="secondary-btn" data-testid="switch-to-login">
              Har du allerede en konto? Logg inn
            </button>
          </form>
        </section>
      </div>

      <!-- Feed -->
      <section id="feed" style="display: none;">
        <h2>Innholdsfeed</h2>

        <!-- Profil -->
        <div class="profile">
          <img id="profile-image" src="img/profile.jpg" alt="Bruker" class="profile-img" />
          <span id="username">Ukjent bruker</span>
        </div>

        <!-- Opprett innlegg -->
        <form id="new-post-form" data-testid="new-post-form">
          <input type="text" id="post-title" placeholder="Tittel" required data-testid="post-title" />
          <textarea id="post-content" placeholder="Skriv noe..." required data-testid="post-content"></textarea>
          <input type="file" id="post-image" data-testid="post-image" />
          <input type="text" id="post-image-url" placeholder="Lim inn bilde-URL (valgfritt)" />
          <button type="submit" data-testid="post-submit">Publiser</button>
        </form>

        <!-- Søk -->
        <div class="search-bar">
        <input type="text" id="search-input" placeholder="Søk i innlegg..." />
       <button id="search-btn">Søk</button>
        </div>


        
        <!-- Innlegg -->
        <div id="posts-container" data-testid="posts-container">
          <p>Ingen innlegg funnet.</p>
        </div>

        <!-- Paginering -->
        <div id="pagination-controls" class="pagination">
          <button id="prev-page-btn" class="pagination-btn">Forrige</button>
          <span id="page-indicator">Side 1</span>
          <button id="next-page-btn" class="pagination-btn">Neste</button>
        </div>
      </section>
    </main>

    <!-- JavaScript -->
    <script type="module" src="JavaScript/api.mjs"></script>
    <script type="module" src="JavaScript/auth.mjs"></script>
    <script type="module" src="JavaScript/app.mjs"></script>
  </body>
</html>
